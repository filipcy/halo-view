<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">HALO Dock Rev A Iteration 1 geometry review</title>
  <desc id="desc">Front and side schematic of TabletEnvelope, Faceplate, and preliminary DockBody, with deferred features identified.</desc>
  <rect width="1200" height="760" fill="#f4f4f2"/>
  <style>
    text{font-family:Arial,sans-serif;fill:#202124}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#555}.label{font-size:18px;font-weight:700}.note{font-size:15px}.dim{font-size:14px;fill:#555}.line{stroke:#333;stroke-width:2;fill:none}.dash{stroke:#777;stroke-width:2;stroke-dasharray:8 6;fill:none}
  </style>
  <text x="60" y="58" class="title">HALO Dock Rev A — Iteration 1</text>
  <text x="60" y="88" class="sub">Parametric layout review · geometry shown is not a manufacturing release</text>

  <text x="190" y="132" class="label">FRONT</text>
  <rect x="90" y="155" width="274" height="434" rx="48" fill="#222"/>
  <rect x="102" y="167" width="250" height="422" rx="36" fill="#4b4f52"/>
  <rect x="103" y="168" width="248" height="420" rx="35" fill="#9ba1a4"/>
  <text x="111" y="615" class="note">Faceplate: 6 mm bezel + 0.5 mm lip</text>
  <path d="M75 155h-20v434h20M55 372h-12" class="line"/>
  <text x="17" y="380" class="dim" transform="rotate(-90 17 380)">223 mm Faceplate envelope</text>
  <path d="M90 615v18h274v-18" class="line"/>
  <text x="160" y="653" class="dim">137 mm envelope</text>

  <text x="575" y="132" class="label">SIDE / LAYER STACK</text>
  <rect x="500" y="190" width="36" height="360" fill="#656b70"/>
  <rect x="536" y="190" width="96" height="360" fill="#9ba1a4"/>
  <rect x="635" y="180" width="24" height="380" fill="#222"/>
  <path d="M474 190v360" class="dash"/>
  <text x="420" y="580" class="note">wall datum</text>
  <text x="490" y="610" class="note">DockBody</text>
  <text x="545" y="635" class="note">TabletEnvelope</text>
  <text x="626" y="610" class="note">Faceplate</text>
  <path d="M474 165h26" class="line"/><path d="M474 158v14M500 158v14" class="line"/>
  <text x="460" y="145" class="dim">1.5 mm shadow gap (parameter only)</text>

  <rect x="760" y="145" width="380" height="440" rx="12" fill="#fff" stroke="#bbb"/>
  <text x="790" y="185" class="label">ITERATION 1 SCOPE</text>
  <circle cx="800" cy="224" r="6" fill="#27804b"/><text x="820" y="230" class="note">TabletEnvelope reference body</text>
  <circle cx="800" cy="260" r="6" fill="#27804b"/><text x="820" y="266" class="note">Faceplate frame</text>
  <circle cx="800" cy="296" r="6" fill="#27804b"/><text x="820" y="302" class="note">Planar DockBody backing</text>
  <text x="790" y="352" class="label">DEFERRED</text>
  <text x="790" y="386" class="note">USB routing and cable chamber</text>
  <text x="790" y="418" class="note">Latch, guides, and lower shelf</text>
  <text x="790" y="450" class="note">Dual Lock mounting fields</text>
  <text x="790" y="482" class="note">Final edge finishing</text>
  <text x="790" y="532" class="label">PRINT ASSUMPTION</text>
  <text x="790" y="563" class="note">Planar face down · FDM · no supports</text>

  <line x1="60" y1="690" x2="1140" y2="690" stroke="#bbb"/>
  <text x="60" y="720" class="sub">Controlled dimensions remain in the Fusion generator. Diagram is schematic and not to scale.</text>
</svg>
